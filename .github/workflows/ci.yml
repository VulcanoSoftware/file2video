name: CI and release binaries

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: '1.100.0'
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, platform: linux-x86_64}
          - {runner: ubuntu-24.04-arm, platform: linux-aarch64}
          - {runner: windows-2022, platform: windows-x86_64}
          - {runner: macos-15, platform: macos-aarch64}
          - {runner: macos-15, platform: macos-x86_64}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy

      - name: Prepare Intel cross-build and Rosetta
        if: matrix.platform == 'macos-x86_64'
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true
          rustup target add --toolchain "$RUST_VERSION" x86_64-apple-darwin
          {
            echo 'CARGO_BUILD_TARGET=x86_64-apple-darwin'
            echo 'CARGO_TARGET_X86_64_APPLE_DARWIN_RUNNER=/usr/bin/arch -x86_64'
          } >> "$GITHUB_ENV"

      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            brew install ffmpeg
          fi

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((Get-Command ffmpeg -ErrorAction SilentlyContinue) -and
              (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            exit 0
          }
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -eq 0 -and (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
              $ok = $true
              break
            }
            Write-Host "choco install ffmpeg failed (attempt $attempt); retrying in 30 seconds"
            Start-Sleep -Seconds 30
          }
          if (-not $ok) {
            Write-Host "Chocolatey is unavailable; downloading the FFmpeg build directly"
            $dest = "$env:RUNNER_TEMP\\ffmpeg"
            curl.exe -fL --retry 3 --connect-timeout 20 `
              -o "$dest\\ffmpeg.zip" https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Expand-Archive -Path "$dest\\ffmpeg.zip" -DestinationPath $dest
            $bin = (Get-ChildItem "$dest" -Recurse -Directory -Filter bin |
              Select-Object -First 1).FullName
            if (-not $bin) { exit 1 }
            Add-Content $env:GITHUB_PATH $bin
          }

      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -encoders | grep -E '[[:space:]]libx264[[:space:]]'

      - name: Format and lint
        run: |
          cargo "+$RUST_VERSION" fmt --all --check
          cargo "+$RUST_VERSION" clippy --locked --all-targets -- -D warnings

      - name: Test and build release CLI
        run: |
          cargo "+$RUST_VERSION" test --release --locked
          cargo "+$RUST_VERSION" build --release --locked

      - name: Verify Intel binary architecture
        if: matrix.platform == 'macos-x86_64'
        run: |
          architectures=$(lipo "target/$CARGO_BUILD_TARGET/release/file2video" -archs)
          echo "Built Mach-O architecture: $architectures"
          test "$architectures" = x86_64

      - name: Test interoperability with the reference implementation
        if: matrix.platform == 'linux-x86_64'
        run: |
          git clone https://github.com/nuan-cmyk/Bit2Vid.git "$RUNNER_TEMP/bit2vid"
          git -C "$RUNNER_TEMP/bit2vid" checkout --detach b782ae9226ae457a321a3147ae8e77b2b1a42154
          python -m pip install numpy==2.2.6 pycryptodome==3.23.0 reedsolo==1.7.0 tqdm==4.67.1
          python tests/interoperability.py target/release/file2video "$RUNNER_TEMP/bit2vid/src"

      - name: Test release automation
        if: matrix.platform == 'linux-x86_64'
        run: python -m unittest discover -s tests -p test_release.py

      - name: Package CLI and checksum
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python scripts/package.py "$PLATFORM"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: file2video-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: >-
      (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: file2video-release-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: file2video-*
          path: dist
          merge-multiple: true

      - name: Verify and publish archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py dist --publish
