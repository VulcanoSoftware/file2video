[package]
name = "file2video"
version = "0.1.0"
edition = "2024"
description = "Encode and restore encrypted files as Bit2Vid-compatible MP4 video"
publish = false

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ctr = { version = "0.9", features = ["zeroize"] }
getrandom = "0.3"
ghash = { version = "0.5", features = ["zeroize"] }
pbkdf2 = "0.12"
rayon = "1.10"
reed-solomon = "0.2.1"
rpassword = "7"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
zeroize = "1"

[dev-dependencies]
aes-gcm = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
